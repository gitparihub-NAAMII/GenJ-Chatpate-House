name: Build Android APK

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Prepare web files
        run: |
          mkdir -p build/www
          cp -r index.html customer.html manifest.json sw.js css js vendor icons build/www/

      - name: Create Capacitor Android project
        working-directory: build
        run: |
          npm init -y >/dev/null
          npm install @capacitor/core@6 @capacitor/cli@6 @capacitor/android@6 @capacitor/filesystem@6 @capacitor/share@6
          npx cap init "GenJ ChatPate Shop" np.genj.chatpate --web-dir www
          npx cap add android
          npx cap sync android

      - name: Allow vibration (order alerts) and camera (scan customer order QR)
        working-directory: build/android/app/src/main
        run: |
          for p in VIBRATE CAMERA; do
            grep -q "android.permission.$p" AndroidManifest.xml || \
              sed -i "s#</manifest>#    <uses-permission android:name=\"android.permission.$p\" />\n</manifest>#" AndroidManifest.xml
          done
          grep -q "android.hardware.camera" AndroidManifest.xml || \
            sed -i 's#</manifest>#    <uses-feature android:name="android.hardware.camera" android:required="false" />\n</manifest>#' AndroidManifest.xml
          grep -n "uses-" AndroidManifest.xml

      - name: Use shop icon
        working-directory: build/android/app/src/main/res
        run: |
          rm -rf mipmap-anydpi-v26
          for d in mipmap-*; do
            cp ../../../../../www/icons/icon-192.png "$d/ic_launcher.png"
            cp ../../../../../www/icons/icon-192.png "$d/ic_launcher_round.png"
          done

      - name: Build APK
        working-directory: build/android
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon
          cp app/build/outputs/apk/debug/app-debug.apk ../../GenJ-ChatPate-Shop.apk

      - uses: actions/upload-artifact@v4
        with:
          name: GenJ-ChatPate-Shop-apk
          path: GenJ-ChatPate-Shop.apk

      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.0.${{ github.run_number }}
          name: GenJ ChatPate Shop v1.0.${{ github.run_number }}
          body: |
            Android app for GenJ ChatPate Shop.
            Download **GenJ-ChatPate-Shop.apk** on your Android phone, open it and allow "Install unknown apps" when asked.
          files: GenJ-ChatPate-Shop.apk
          make_latest: true
